<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静夜思 - 李白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SimSun', 'STKaiti', serif;
            background: linear-gradient(to bottom, #fef9e7, #f5e6ca);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><path d="M30,30 C40,10 60,10 70,30 C80,50 60,70 30,70 C10,70 10,50 30,30 Z" fill="none" stroke="%23000" stroke-width="2"/></svg>');
            z-index: -1;
            pointer-events: none;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            position: relative;
            border: 1px solid #e0d6c3;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.8rem;
            color: #8b4513;
            margin-bottom: 10px;
            font-weight: normal;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 5px;
        }
        
        .header p {
            font-size: 1.2rem;
            color: #a0522d;
            font-style: italic;
        }
        
        .header::after {
            content: "";
            display: block;
            width: 100px;
            height: 2px;
            background: linear-gradient(to right, transparent, #8b4513, transparent);
            margin: 20px auto;
        }
        
        .poem-content {
            text-align: center;
            margin: 40px 0;
            position: relative;
        }
        
        .poem-text {
            font-size: 1.8rem;
            line-height: 2.2;
            margin-bottom: 30px;
            color: #333;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .poem-line {
            display: block;
            margin: 15px 0;
            transition: transform 0.3s, color 0.3s;
            cursor: pointer;
        }
        
        .poem-line:hover {
            transform: translateX(10px);
            color: #8b4513;
        }
        
        .author {
            text-align: right;
            font-size: 1.4rem;
            color: #8b4513;
            margin-top: 30px;
            font-style: italic;
        }
        
        .decoration {
            position: absolute;
            width: 120px;
            height: 120px;
            opacity: 0.1;
            z-index: 0;
        }
        
        .decoration-1 {
            top: 20px;
            left: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,10 C70,10 90,25 90,50 C90,75 70,90 50,90 C30,90 10,75 10,50 C10,25 30,10 50,10 Z" fill="none" stroke="%238b4513" stroke-width="2"/></svg>');
        }
        
        .decoration-2 {
            bottom: 20px;
            right: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M30,30 C40,10 60,10 70,30 C80,50 60,70 30,70 C10,70 10,50 30,30 Z" fill="none" stroke="%238b4513" stroke-width="2"/></svg>');
        }
        
        .explanation {
            margin-top: 40px;
            padding: 20px;
            background: #f9f4e8;
            border-radius: 8px;
            border-left: 4px solid #8b4513;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        
        .explanation h3 {
            color: #8b4513;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        
        .moon {
            position: fixed;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #fff, #f5e6ca);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            z-index: -1;
            animation: float 8s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .poem-text {
                font-size: 1.5rem;
            }
            
            .moon {
                width: 60px;
                height: 60px;
                top: 20px;
                right: 20px;
            }
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #8b4513;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="moon"></div>
    
    <div class="container">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        
        <div class="header">
            <h1>静夜思</h1>
            <p>唐诗经典 · 李白</p>
        </div>
        
        <div class="poem-content">
            <div class="poem-text">
                <span class="poem-line">床前明月光，</span>
                <span class="poem-line">疑是地上霜。</span>
                <span class="poem-line">举头望明月，</span>
                <span class="poem-line">低头思故乡。</span>
            </div>
            
            <div class="author">—— 李白</div>
        </div>
        
        <div class="explanation">
            <h3>诗歌赏析</h3>
            <p>《静夜思》是唐代诗人李白所作的一首五言古诗。此诗描写了秋日夜晚，旅居在外的诗人于屋内抬头望月而思念家乡的感受。前两句写诗人在作客他乡的特定环境中一刹那间所产生的错觉；后两句通过动作神态的刻画，深化思乡之情。全诗运用比喻、衬托等手法，表达客居思乡之情，语言清新朴素而韵味含蓄无穷，历来广为传诵。</p>
        </div>
    </div>
    
    <div class="footer">
        <p>唐诗经典 · 中华文化瑰宝</p>
    </div>

    <script>
        // 为诗句添加点击效果
        document.querySelectorAll('.poem-line').forEach(line => {
            line.addEventListener('click', function() {
                this.style.color = '#8b4513';
                this.style.fontWeight = 'bold';
                setTimeout(() => {
                    this.style.color = '';
                    this.style.fontWeight = '';
                }, 1000);
            });
        });
        
        // 月亮浮动动画
        const moon = document.querySelector('.moon');
        setInterval(() => {
            const randomX = Math.random() * 20 - 10;
            const randomY = Math.random() * 20 - 10;
            moon.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }, 3000);
    </script>
</body>
</html>
